<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Red Cedar rye whiskey synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Red Cedar straight rye whiskey.</desc>
  <rect width="800" height="520" rx="24" fill="#cfc0af"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#eee4d3" stroke="#723d32" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#eee4d3" stroke="#723d32" stroke-width="6"/>
  <path d="M200 75l-62 119h40l-53 82h150l-53-82h40z" fill="#8d4137"/>
  <path d="M200 84v192" stroke="#542d28" stroke-width="7"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#5b3029">
    <text x="200" y="330" font-size="38" font-weight="700">RED CEDAR</text>
    <text x="200" y="371" font-size="23">STRAIGHT RYE WHISKEY</text>
    <text x="200" y="414" font-size="18">46% ALC./VOL. (92 PROOF) • 750 mL</text>
    <text x="600" y="82" font-size="17" font-weight="700">RED CEDAR DISTILLING</text>
    <text x="600" y="111" font-size="17">TRAVERSE CITY, MI</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#2d211c" font-size="13">
    <text x="456" y="190" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="216">(1) According to the Surgeon General, women</text>
    <text x="456" y="237">should not drink alcoholic beverages during</text>
    <text x="456" y="258">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="287">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="308">your ability to drive a car or operate machinery,</text>
    <text x="456" y="329">and may cause health problems.</text>
    <text x="456" y="448" fill="#765d52">Synthetic demo label • Not for sale</text>
  </g>
