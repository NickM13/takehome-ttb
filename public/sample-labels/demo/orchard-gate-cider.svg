<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Orchard Gate cider synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Orchard Gate dry hard cider with part of the government warning obscured.</desc>
  <rect width="800" height="520" rx="24" fill="#d9e3c2"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#fff8df" stroke="#58723b" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#fff8df" stroke="#58723b" stroke-width="6"/>
  <circle cx="174" cy="158" r="58" fill="#b84b3d"/>
  <circle cx="226" cy="158" r="58" fill="#d86548"/>
  <path d="M200 111c5-31 20-47 45-55M202 101c-22-20-41-18-57-6" fill="none" stroke="#58723b" stroke-width="9"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#42592c">
    <text x="200" y="270" font-size="37" font-weight="700">ORCHARD GATE</text>
    <text x="200" y="316" font-size="25">DRY HARD CIDER</text>
    <text x="200" y="369" font-size="18">7% ALC./VOL.</text>
    <text x="200" y="405" font-size="19">500 mL</text>
    <text x="600" y="82" font-size="17" font-weight="700">ORCHARD GATE CIDER WORKS</text>
    <text x="600" y="111" font-size="17">ITHACA, NY</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#22301c" font-size="13">
    <text x="456" y="190" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="216">(1) According to the Surgeon General, women</text>
    <text x="456" y="237">should not drink alcoholic beverages during</text>
    <text x="456" y="258">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="287">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="308">your ability to drive a car or operate machinery,</text>
    <text x="456" y="329">and may cause health problems.</text>
    <path d="M520 228l196 104M503 279l220-18M548 201l124 151" stroke="#f4edcf" stroke-width="28" opacity=".96"/>
    <text x="456" y="448" fill="#65735a">Synthetic demo label • Warning intentionally obscured</text>
  </g>
</svg>
