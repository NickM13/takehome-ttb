<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Sierra Azul mezcal synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Sierra Azul mezcal showing Guatemala as the country of origin.</desc>
  <rect width="800" height="520" rx="24" fill="#bacbd3"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#f2eadb" stroke="#244f66" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#f2eadb" stroke="#244f66" stroke-width="6"/>
  <path d="M82 203l76-98 42 61 42-84 76 121z" fill="#5e879a"/>
  <path d="M174 203l26-37 19 29 23-40 31 48z" fill="#e9ece6"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#244f66">
    <text x="200" y="268" font-size="38" font-weight="700">SIERRA AZUL</text>
    <text x="200" y="314" font-size="25">MEZCAL ARTESANAL</text>
    <text x="200" y="368" font-size="18">45% ALC./VOL. (90 PROOF)</text>
    <text x="200" y="404" font-size="19">750 mL</text>
    <text x="600" y="78" font-size="19" font-weight="700">PRODUCT OF GUATEMALA</text>
    <text x="600" y="112" font-size="16">IMPORTED BY SIERRA AZUL IMPORTS</text>
    <text x="600" y="138" font-size="16">AUSTIN, TX</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#17242d" font-size="13">
    <text x="456" y="202" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="228">(1) According to the Surgeon General, women</text>
    <text x="456" y="249">should not drink alcoholic beverages during</text>
    <text x="456" y="270">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="299">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="320">your ability to drive a car or operate machinery,</text>
    <text x="456" y="341">and may cause health problems.</text>
    <text x="456" y="448" fill="#596b75">Synthetic demo label • Intentional origin mismatch</text>
  </g>
</svg>
