<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Cascade Pear brandy synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Cascade Pear brandy with the net contents intentionally absent.</desc>
  <rect width="800" height="520" rx="24" fill="#dfe7c6"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#fff9df" stroke="#4f6c31" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#fff9df" stroke="#4f6c31" stroke-width="6"/>
  <path d="M200 84c-28 14-24 50-9 66-36 2-62 30-62 68 0 44 31 77 71 77s71-33 71-77c0-38-26-66-62-68 15-16 19-52-9-66z" fill="#b4c85d" stroke="#4f6c31" stroke-width="5"/>
  <path d="M205 90c20-26 48-24 58-14-18 4-35 14-58 14z" fill="#64863b"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#3f5928">
    <text x="200" y="348" font-size="34" font-weight="700">CASCADE PEAR</text>
    <text x="200" y="387" font-size="23">PEAR BRANDY</text>
    <text x="200" y="424" font-size="18">42% ALC./VOL. (84 PROOF)</text>
    <text x="600" y="82" font-size="17" font-weight="700">CASCADE FRUIT SPIRITS</text>
    <text x="600" y="111" font-size="17">HOOD RIVER, OR</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#22301c" font-size="13">
    <text x="456" y="190" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="216">(1) According to the Surgeon General, women</text>
    <text x="456" y="237">should not drink alcoholic beverages during</text>
    <text x="456" y="258">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="287">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="308">your ability to drive a car or operate machinery,</text>
    <text x="456" y="329">and may cause health problems.</text>
    <text x="456" y="448" fill="#65735a">Synthetic demo label • Net contents omitted</text>
  </g>
</svg>
