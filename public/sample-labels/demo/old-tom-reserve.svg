<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Old Tom Reserve bourbon synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Old Tom Reserve Kentucky straight bourbon whiskey.</desc>
  <rect width="800" height="520" rx="24" fill="#2f2622"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#e6d5b6" stroke="#b9883c" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#e6d5b6" stroke="#b9883c" stroke-width="6"/>
  <circle cx="200" cy="142" r="68" fill="none" stroke="#82582e" stroke-width="6"/>
  <text x="200" y="164" font-family="Georgia, serif" text-anchor="middle" font-size="58" font-weight="700" fill="#5a3822">OT</text>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#4a2d1d">
    <text x="200" y="252" font-size="34" font-weight="700">OLD TOM RESERVE</text>
    <text x="200" y="292" font-size="17">KENTUCKY STRAIGHT</text>
    <text x="200" y="320" font-size="21">BOURBON WHISKEY</text>
    <text x="200" y="372" font-size="18">45% ALC./VOL. (90 PROOF)</text>
    <text x="200" y="407" font-size="19">1 L</text>
    <text x="600" y="82" font-size="17" font-weight="700">OLD TOM DISTILLERY</text>
    <text x="600" y="111" font-size="17">FRANKFORT, KY</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#2d211c" font-size="13">
    <text x="456" y="190" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="216">(1) According to the Surgeon General, women</text>
    <text x="456" y="237">should not drink alcoholic beverages during</text>
    <text x="456" y="258">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="287">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="308">your ability to drive a car or operate machinery,</text>
    <text x="456" y="329">and may cause health problems.</text>
    <text x="456" y="448" fill="#765d52">Synthetic demo label • Not for sale</text>
  </g>
</svg>
