<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">North Fork vodka synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for North Fork vodka with an intentionally incomplete government warning.</desc>
  <rect width="800" height="520" rx="24" fill="#d9e1e4"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#f8faf9" stroke="#263d49" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#f8faf9" stroke="#263d49" stroke-width="6"/>
  <path d="M95 102l105 88 105-88M95 157l105 88 105-88" fill="none" stroke="#6c8995" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243b47">
    <text x="200" y="286" font-size="38" font-weight="700" letter-spacing="4">NORTH FORK</text>
    <text x="200" y="329" font-size="25">VODKA</text>
    <text x="200" y="374" font-size="18">40% ALC./VOL. (80 PROOF)</text>
    <text x="200" y="408" font-size="19">1 L</text>
    <text x="600" y="83" font-size="17" font-weight="700">NORTH FORK SPIRITS</text>
    <text x="600" y="112" font-size="17">MINNEAPOLIS, MN</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#17242d" font-size="13">
    <text x="456" y="190" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="218">Consumption of alcoholic beverages impairs</text>
    <text x="456" y="239">your ability to drive a car or operate machinery,</text>
    <text x="456" y="260">and may cause health problems.</text>
    <rect x="450" y="284" width="300" height="54" rx="6" fill="#fbe8e5" stroke="#a9382b"/>
    <text x="466" y="316" fill="#81271d" font-weight="700">Pregnancy warning text is absent.</text>
    <text x="456" y="448" fill="#596b75">Synthetic demo label • Intentional mismatch</text>
  </g>
</svg>
