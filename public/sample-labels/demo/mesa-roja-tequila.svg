<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Mesa Roja tequila blanco synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork with front and back panels for imported Mesa Roja tequila.</desc>
  <rect width="800" height="520" rx="24" fill="#efd9c4"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#fff5df" stroke="#9d3526" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#fff5df" stroke="#9d3526" stroke-width="6"/>
  <path d="M106 172l94-92 94 92z" fill="#d05d3d" opacity=".9"/>
  <circle cx="200" cy="139" r="28" fill="#f1b24a"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#73271f">
    <text x="200" y="232" font-size="38" font-weight="700" letter-spacing="2">MESA ROJA</text>
    <text x="200" y="276" font-size="23">TEQUILA BLANCO</text>
    <text x="200" y="329" font-size="18">40% ALC./VOL. (80 PROOF)</text>
    <text x="200" y="365" font-size="19">750 mL</text>
    <text x="600" y="78" font-size="19" font-weight="700">PRODUCT OF MEXICO</text>
    <text x="600" y="112" font-size="16">IMPORTED BY MESA ROJA IMPORTS</text>
    <text x="600" y="138" font-size="16">SAN DIEGO, CA</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#2d211c" font-size="13">
    <text x="456" y="202" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="228">(1) According to the Surgeon General, women</text>
    <text x="456" y="249">should not drink alcoholic beverages during</text>
    <text x="456" y="270">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="299">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="320">your ability to drive a car or operate machinery,</text>
    <text x="456" y="341">and may cause health problems.</text>
    <text x="456" y="448" fill="#765d52">Synthetic demo label • Not for sale</text>
  </g>
</svg>
