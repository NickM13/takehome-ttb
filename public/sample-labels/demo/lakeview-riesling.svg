<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Lakeview Cellars Riesling synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork for Lakeview Cellars imported German Riesling.</desc>
  <rect width="800" height="520" rx="24" fill="#dbe8ef"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#f7fbf3" stroke="#426d7c" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#f7fbf3" stroke="#426d7c" stroke-width="6"/>
  <circle cx="200" cy="142" r="72" fill="#d9e5aa"/>
  <path d="M122 171c48-34 102-34 156 0M122 189c48-34 102-34 156 0M171 98c22 12 36 30 42 53" fill="none" stroke="#426d7c" stroke-width="6"/>
  <g font-family="Georgia, serif" text-anchor="middle" fill="#274d5b">
    <text x="200" y="260" font-size="34" font-weight="700">LAKEVIEW CELLARS</text>
