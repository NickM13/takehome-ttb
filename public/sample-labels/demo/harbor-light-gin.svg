<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Harbor Light distilled gin synthetic demo label</title>
  <desc id="desc">Synthetic demo label artwork with front and back panels for Harbor Light distilled gin.</desc>
  <rect width="800" height="520" rx="24" fill="#dbeaf0"/>
  <rect x="28" y="28" width="344" height="464" rx="18" fill="#f8f4e8" stroke="#174a63" stroke-width="6"/>
  <rect x="428" y="28" width="344" height="464" rx="18" fill="#f8f4e8" stroke="#174a63" stroke-width="6"/>
  <path d="M92 176h216M120 192h160" stroke="#b7933f" stroke-width="4"/>
  <circle cx="200" cy="112" r="42" fill="none" stroke="#174a63" stroke-width="5"/>
  <path d="M174 122c18-38 42-38 52 0M160 136h80" fill="none" stroke="#174a63" stroke-width="5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17394c">
    <text x="200" y="228" font-size="34" font-weight="700" letter-spacing="3">HARBOR LIGHT</text>
    <text x="200" y="270" font-size="22">DISTILLED GIN</text>
    <text x="200" y="328" font-size="19">47% ALC./VOL. (94 PROOF)</text>
    <text x="200" y="365" font-size="19">750 mL</text>
    <text x="600" y="82" font-size="18" font-weight="700">DISTILLED &amp; BOTTLED BY</text>
    <text x="600" y="111" font-size="17">HARBOR LIGHT DISTILLING</text>
    <text x="600" y="138" font-size="17">PORTLAND, OR</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#17242d" font-size="13">
    <text x="456" y="202" font-weight="700">GOVERNMENT WARNING:</text>
    <text x="456" y="228">(1) According to the Surgeon General, women</text>
    <text x="456" y="249">should not drink alcoholic beverages during</text>
    <text x="456" y="270">pregnancy because of the risk of birth defects.</text>
    <text x="456" y="299">(2) Consumption of alcoholic beverages impairs</text>
    <text x="456" y="320">your ability to drive a car or operate machinery,</text>
    <text x="456" y="341">and may cause health problems.</text>
    <text x="456" y="448" fill="#596b75">Synthetic demo label • Not for sale</text>
  </g>
</svg>
